<header class="header">
  <div class="header-inner">
    <a class="brand" routerLink="/gallery">
      <app-icon class="brand-mark" name="map-pin" [size]="18" />
      <span class="brand-name">Photo Map</span>
    </a>

    <nav class="nav" aria-label="Main">
      @for (item of menuItems; track item.route) {
        <a class="nav-link" [routerLink]="item.route" routerLinkActive="nav-link--active">
          <app-icon [name]="item.icon" [size]="16" />
          <span>{{ item.title }}</span>
        </a>
      }
    </nav>

    <div class="header-end">
      @for (source of sources(); track source.photoSourceId) {
        <span class="app-badge" [class.app-badge--success]="source.isUserAuthorized">
          {{ source.photoSourceName }} {{ source.isUserAuthorized ? 'connected' : 'not connected' }}
        </span>
      }
      <app-theme-toggle />
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<app-toast-host />
