<button
  class="control"
  [class.control--visible]="canScrollUp()"
  appButton="outline"
  iconOnly
  type="button"
  aria-label="Scroll to top"
  [attr.tabindex]="canScrollUp() ? null : -1"
  (click)="scrollTo('top')"
>
  <app-icon name="chevron-up" [size]="18" />
</button>

<button
  class="control"
  [class.control--visible]="canScrollDown()"
  appButton="outline"
  iconOnly
  type="button"
  aria-label="Scroll to bottom"
  [attr.tabindex]="canScrollDown() ? null : -1"
  (click)="scrollTo('bottom')"
>
  <app-icon name="chevron-down" [size]="18" />
</button>
