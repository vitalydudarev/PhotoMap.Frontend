<section class="grid">
  @for (photo of photos; track photo.id; let index = $index) {
    @let deleted = isDeleted(photo);
    @let tags = photo.tags ?? [];
    @let editing = editingId() === photo.id;
    <div class="thumb" [class.thumb--deleted]="deleted" [class.thumb--editing]="editing">
      <button class="open" type="button" [title]="photo.fileName" (click)="open(index)">
        <img
          [src]="photo.thumbnailLargeUrl"
          [alt]="photo.fileName"
          width="190"
          height="190"
          loading="lazy"
          (error)="onThumbnailError($event)"
        />

        @let gps = hasGps(photo);
        <span
          class="gps"
          [class.gps--off]="!gps"
          role="img"
          [attr.aria-label]="gps ? 'Has GPS location' : 'No GPS location'"
          [title]="gps ? 'Has GPS location' : 'No GPS location'"
        >
          <app-icon [name]="gps ? 'map-pin' : 'map-pin-off'" [size]="14" />
        </span>

        @let copies = duplicates().get(photo.id) ?? 0;
        @if (copies > 0) {
          @let copiesLabel = copies === 1 ? 'Has a duplicate' : 'Has ' + copies + ' duplicates';
          <span class="duplicate" role="img" [attr.aria-label]="copiesLabel" [title]="copiesLabel">
            <app-icon name="copy" [size]="14" />
          </span>
        }

        @if (tags.length > 0) {
          <!-- the tag button tells them to a screen reader, so this list is for the eyes only -->
          <span class="tags" aria-hidden="true">
            <span class="tags-list">
              @for (tag of tags; track tag) {
                <span class="tag">{{ tag }}</span>
              }
            </span>
          </span>
        }
      </button>

      @let label = (deleted ? 'Restore ' : 'Delete ') + photo.fileName;
      <button
        class="action"
        type="button"
        [attr.aria-label]="label"
        [title]="deleted ? 'Restore' : 'Delete'"
        [disabled]="busy().has(photo.id)"
        (click)="deleted ? restore.emit(photo) : markAsDeleted.emit(photo)"
      >
        <app-icon [name]="deleted ? 'restore' : 'trash'" [size]="14" />
      </button>

      @if (taggable()) {
        <button
          #tagButton
          class="action tag-button"
          type="button"
          aria-haspopup="dialog"
          [attr.aria-expanded]="editing"
          [attr.aria-label]="tagsLabel(photo)"
          [title]="tags.length > 0 ? 'Edit tags' : 'Add tags'"
          (click)="toggleTags(photo, tagButton)"
        >
          <app-icon name="tag" [size]="14" />
          @if (tags.length > 0) {
            <span class="tag-count">{{ tags.length }}</span>
          }
        </button>
      }
    </div>
  }
</section>

@if (editingPhoto(); as photo) {
  <app-photo-tag-editor
    class="tag-editor"
    [style.top.px]="editorPosition().top"
    [style.left.px]="editorPosition().left"
    [photo]="photo"
    [userId]="userId()"
    [existingTags]="tagOptions() ?? []"
    (saved)="onTagsSaved(photo, $event)"
    (closed)="closeTags()"
  />
}

<app-scroll-control></app-scroll-control>
