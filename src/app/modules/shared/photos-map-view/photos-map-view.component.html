@if (provider() === 'google') {
  <app-google-photo-map [photos]="geotaggedPhotos()" (photosSelected)="openPhotos($event)" />
} @else {
  <app-leaflet-photo-map [photos]="geotaggedPhotos()" (photosSelected)="openPhotos($event)" />
}

<app-segmented class="provider-switch" aria-label="Map provider" [options]="providers" [(value)]="provider" />

@if (geotaggedPhotos().length === 0) {
  <p class="notice">None of these photos has a location.</p>
}
