@if (provider() === 'google') {
  <app-google-photo-map
    [photos]="geotaggedPhotos()"
    [highlighted]="group()"
    [showAccuracyAreas]="showAccuracyAreas()"
    (photosSelected)="openPhotos($event)"
    (groupOpened)="group.set($event)"
    (areaChanged)="area.set($event)"
  />
} @else {
  <app-leaflet-photo-map
    [photos]="geotaggedPhotos()"
    [highlighted]="group()"
    [showAccuracyAreas]="showAccuracyAreas()"
    (photosSelected)="openPhotos($event)"
    (groupOpened)="group.set($event)"
    (areaChanged)="area.set($event)"
  />
}

@if (group(); as groupPhotos) {
  <app-photo-group-panel [photos]="groupPhotos" (photosSelected)="openPhotos($event)" (closed)="group.set(undefined)" />
}

<div class="controls">
  <app-segmented class="provider-switch" aria-label="Map provider" [options]="providers" [(value)]="provider" />

  @if (showInGallery() && photosInArea() > 0) {
    <button
      class="gallery-link"
      type="button"
      size="sm"
      appButton="filled"
      title="Show the photos the map shows in the gallery"
      (click)="openInGallery()"
    >
      <app-icon name="grid" [size]="16" />
      Show {{ photosInArea() }} in gallery
    </button>
  }

  @if (hasInaccurateLocations()) {
    <button
      class="accuracy-switch"
      type="button"
      size="sm"
      [appButton]="showAccuracyAreas() ? 'tonal' : 'outline'"
      [attr.aria-pressed]="showAccuracyAreas()"
      title="Circle the areas the photos with an inaccurate location may have been taken in"
      (click)="showAccuracyAreas.set(!showAccuracyAreas())"
    >
      <app-icon name="alert-triangle" [size]="16" />
      Inaccurate locations
    </button>
  }
</div>

@if (geotaggedPhotos().length === 0) {
  <p class="notice">None of these photos has a location.</p>
}
