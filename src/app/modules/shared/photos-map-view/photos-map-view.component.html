@if (provider() === 'google') {
  <app-google-photo-map
    [photos]="geotaggedPhotos()"
    [highlighted]="group()"
    (photosSelected)="openPhotos($event)"
    (groupOpened)="group.set($event)"
  />
} @else {
  <app-leaflet-photo-map
    [photos]="geotaggedPhotos()"
    [highlighted]="group()"
    (photosSelected)="openPhotos($event)"
    (groupOpened)="group.set($event)"
  />
}

@if (group(); as groupPhotos) {
  <app-photo-group-panel [photos]="groupPhotos" (photosSelected)="openPhotos($event)" (closed)="group.set(undefined)" />
}

<app-segmented class="provider-switch" aria-label="Map provider" [options]="providers" [(value)]="provider" />

@if (geotaggedPhotos().length === 0) {
  <p class="notice">None of these photos has a location.</p>
}
