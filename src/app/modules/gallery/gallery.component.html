<div class="gallery">
  <div class="toolbar">
    <div class="toolbar-inner">
      <app-segmented [options]="viewModes" [(value)]="selectedViewMode" [iconsOnly]="true" />

      <app-paginator
        [length]="totalCount()"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizes"
        (page)="pageUpdated($event)"
      />
    </div>
  </div>

  @if (showSpinner()) {
    <div class="state">
      <app-spinner [size]="28" label="Loading photos" />
      <p>Loading photos…</p>
    </div>
  } @else if (photos().length === 0) {
    <div class="state">
      <p>No photos yet. Connect a photo source and start processing to see them here.</p>
    </div>
  } @else if (selectedViewMode() === 'thumb') {
    <app-photos-thumb-view [photos]="photos()" />
  } @else {
    <app-photos-map-view [photos]="photos()" />
  }
</div>
