<div style="height: 100%">
  <div class="m-2">
    <mat-card>
      <div class="d-flex align-items-start justify-content-between">
        <mat-button-toggle-group #group="matButtonToggleGroup" [(value)]="selectedViewMode" (change)="onViewModeChanged(group.value)">
          <mat-button-toggle value="{{ thumbViewMode }}">
            <mat-icon>collections</mat-icon>
          </mat-button-toggle>
          <mat-button-toggle value="{{ mapViewMode }}">
            <mat-icon>map</mat-icon>
          </mat-button-toggle>
        </mat-button-toggle-group>

        <mat-paginator
          [length]="totalCount"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizes"
          [showFirstLastButtons]="true"
          (page)="pageUpdated($event)"
        >
        </mat-paginator>
      </div>
    </mat-card>
  </div>

  @if (showSpinner) {
    <div class="spinner-wrapper" style="height: calc(100% - 64px)">
      <mat-spinner></mat-spinner>
    </div>
  }

  @if (photos) {
    <div style="height: calc(100% - 72px)">
      @if (selectedViewMode === thumbViewMode) {
        <app-photos-thumb-view [photos]="photos"></app-photos-thumb-view>
      }
      @if (selectedViewMode === mapViewMode) {
        <app-photos-map-view [photos]="photos"></app-photos-map-view>
      }
    </div>
  }
</div>
