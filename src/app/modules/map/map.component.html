@if (loading()) {
  <div class="state">
    <app-spinner [size]="28" label="Loading photos" />
    <p>Loading photos…</p>
  </div>
} @else if (failed()) {
  <div class="state">
    <p>The photos could not be loaded.</p>
  </div>
} @else if (photos().length === 0) {
  <div class="state">
    <p>No photos with a location yet. Connect a photo source and start processing to see them here.</p>
  </div>
} @else {
  <app-photos-map-view class="map" [photos]="photos()" />
}
