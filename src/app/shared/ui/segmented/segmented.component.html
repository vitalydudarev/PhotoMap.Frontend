@for (option of options(); track option.value) {
  <button
    type="button"
    class="segment"
    [class.segment--selected]="option.value === value()"
    [attr.aria-pressed]="option.value === value()"
    [attr.aria-label]="iconsOnly() ? option.label : null"
    [title]="option.label"
    (click)="select(option)"
  >
    @if (option.icon) {
      <app-icon [name]="option.icon" [size]="18" />
    }
    @if (!iconsOnly()) {
      <span>{{ option.label }}</span>
    }
  </button>
}
