<button
  type="button"
  class="heading"
  [attr.aria-expanded]="!collapsed()"
  [attr.aria-controls]="listId"
  (click)="collapsed.set(!collapsed())"
>
  <span class="heading-label">{{ label() }}</span>
  <span class="heading-summary" [class.heading-summary--narrowed]="!allSelected()">{{ summary() }}</span>
  <app-icon class="chevron" [class.chevron--open]="!collapsed()" name="chevron-down" [size]="16" />
</button>

@if (!collapsed()) {
  @if (searchable()) {
    <input
      type="search"
      class="search"
      [attr.aria-label]="'Search ' + label()"
      [attr.aria-controls]="listId"
      placeholder="Search"
      [value]="query()"
      (input)="query.set($any($event.target).value)"
    />
  }

  <div class="options" role="group" [id]="listId" [attr.aria-label]="label()">
    @if (shownOptions().length > 0) {
      <label class="option option--all">
        <input
          type="checkbox"
          [checked]="allShownSelected()"
          [indeterminate]="!allShownSelected() && !noneShownSelected()"
          (change)="toggleAll()"
        />
        <span>{{ searching() ? 'All found' : 'All' }}</span>
      </label>
    } @else {
      <p class="no-match">Nothing found.</p>
    }

    @for (option of shownOptions(); track option.value; let index = $index) {
      @if (startsGroup(index)) {
        <span class="group" role="presentation">{{ option.group }}</span>
      }

      <!-- the checkbox adds or drops the option, while the rest of the row picks it alone: a shortcut for the mouse,
           since the keyboard reaches the checkbox -->
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <label class="option" (click)="pickOnly(option, $event)">
        <input type="checkbox" [checked]="isSelected(option)" (change)="toggle(option)" />
        <!-- a long label, such as a folder, is cut short, so the whole of it shows on hover -->
        <span class="option-label" [title]="option.hint ? option.label + ', ' + option.hint : option.label"
          >{{ option.label }}
          @if (option.hint) {
            <span class="option-hint">{{ option.hint }}</span>
          }
        </span>
      </label>
    }
  </div>
}
