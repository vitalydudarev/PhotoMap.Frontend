<button type="button" class="trigger" aria-haspopup="true" [attr.aria-expanded]="open()" (click)="toggleOpen()">
  <span class="trigger-label">{{ label() }}:</span>
  <span class="trigger-value">{{ summary() }}</span>
  <app-icon class="chevron" [class.chevron--open]="open()" name="chevron-down" [size]="16" />
</button>

@if (open()) {
  <div class="panel" role="group" [attr.aria-label]="label()">
    <label class="option option--all">
      <input type="checkbox" [checked]="allSelected()" [indeterminate]="!allSelected() && !noneSelected()" (change)="toggleAll()" />
      <span>All</span>
    </label>

    @for (option of options(); track option.value) {
      <label class="option">
        <input type="checkbox" [checked]="isSelected(option)" (change)="toggle(option)" />
        <span>{{ option.label }}</span>
      </label>
    }
  </div>
}
