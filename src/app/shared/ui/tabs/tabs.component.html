@for (option of options(); track option.value) {
  <button
    type="button"
    role="tab"
    class="tab"
    [class.tab--selected]="option.value === value()"
    [id]="tabId(idPrefix(), option.value)"
    [attr.aria-selected]="option.value === value()"
    [attr.aria-controls]="tabPanelId(idPrefix(), option.value)"
    [tabIndex]="option.value === value() ? 0 : -1"
    (click)="select(option)"
    (keydown)="onKeydown($event)"
  >
    @if (option.icon) {
      <app-icon [name]="option.icon" [size]="16" />
    }
    <span>{{ option.label }}</span>
    @if (option.busy) {
      <span class="tab-busy"><span class="app-visually-hidden">(running)</span></span>
    }
  </button>
}
